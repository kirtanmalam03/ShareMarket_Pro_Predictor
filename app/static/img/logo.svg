<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stock Predictor Pro logo">
  <defs>
    <linearGradient id="g1" x1="22" y1="18" x2="140" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#E0F2FE"/>
      <stop offset="0.7" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="g2" x1="28" y1="30" x2="132" y2="134" gradientUnits="userSpaceOnUse">
