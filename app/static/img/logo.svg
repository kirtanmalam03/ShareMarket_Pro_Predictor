  <!-- Minimal chart icon -->
  <g stroke="#0F172A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 108 L66 88 L84 98 L110 66" />
  </g>
  <g fill="#0F172A">
    <circle cx="44" cy="108" r="5.5"/>
    <circle cx="66" cy="88" r="5.5"/>
    <circle cx="84" cy="98" r="5.5"/>
    <circle cx="110" cy="66" r="5.5"/>
