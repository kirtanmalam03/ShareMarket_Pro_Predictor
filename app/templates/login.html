{% extends "base.html" %}

{% block title %}Login - ShareMarket Pro Predictor{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[72vh] py-6">
    <div class="relative w-full max-w-md">
        <!-- Background Ambient Glow -->
        <div class="absolute -top-12 -left-12 w-48 h-48 bg-indigo-500/15 dark:bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-48 h-48 bg-cyan-500/15 dark:bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10 section-card p-8 space-y-6 border-indigo-500/20">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 border border-indigo-200 dark:border-indigo-500/20 mx-auto flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-2xl shadow-lg shadow-indigo-500/10">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="text-2xl font-heading font-bold text-slate-900 dark:text-slate-100">Welcome Back</h1>
                <p class="text-xs text-slate-600 dark:text-slate-400">Login to access your ShareMarket Pro portfolio</p>
            </div>
            
            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Username</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-user absolute left-3.5 text-slate-400 text-sm pointer-events-none z-10"></i>
                        <input type="text" name="username" required class="input-field w-full pl-10 text-sm" placeholder="Enter your username">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-key absolute left-3.5 text-slate-400 text-sm pointer-events-none z-10"></i>
                        <input type="password" name="password" required class="input-field w-full pl-10 text-sm" placeholder="Enter your password">
                    </div>
                </div>
                
                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 text-slate-600 dark:text-slate-400 cursor-pointer">
                        <input type="checkbox" name="remember" id="remember" class="rounded border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-indigo-600 focus:ring-indigo-500">
                        Remember Me
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary w-full justify-center py-3 text-sm font-semibold shadow-lg shadow-indigo-500/25">
                    <i class="fas fa-sign-in-alt"></i> Login to Account
                </button>
            </form>
            
            <div class="text-center pt-2 border-t border-slate-200 dark:border-slate-800/80">
                <p class="text-xs text-slate-600 dark:text-slate-400">
                    Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Register free</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
