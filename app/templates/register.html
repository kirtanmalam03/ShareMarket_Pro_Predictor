{% extends "base.html" %}

{% block title %}Register Account - ShareMarket Pro Predictor{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[75vh] py-6">
    <div class="relative w-full max-w-md">
        <!-- Background Ambient Glow -->
        <div class="absolute -top-12 -left-12 w-48 h-48 bg-emerald-500/15 dark:bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-48 h-48 bg-indigo-500/15 dark:bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10 section-card p-8 space-y-6 border-emerald-500/20">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/20 mx-auto flex items-center justify-center text-emerald-600 dark:text-emerald-400 text-2xl shadow-lg shadow-emerald-500/10">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="text-2xl font-heading font-bold text-slate-900 dark:text-slate-100">Create Free Account</h1>
                <p class="text-xs text-slate-600 dark:text-slate-400">Start predicting stocks with ShareMarket Pro</p>
            </div>
            
            <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Username</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-user absolute left-3.5 text-slate-400 text-sm pointer-events-none z-10"></i>
                        <input type="text" name="username" required class="input-field w-full pl-10 text-sm" placeholder="Choose a username">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email Address</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-envelope absolute left-3.5 text-slate-400 text-sm pointer-events-none z-10"></i>
                        <input type="email" name="email" required class="input-field w-full pl-10 text-sm" placeholder="you@example.com">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-key absolute left-3.5 text-slate-400 text-sm pointer-events-none z-10"></i>
                        <input type="password" name="password" required minlength="6" class="input-field w-full pl-10 text-sm" placeholder="Minimum 6 characters">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Confirm Password</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-shield-check absolute left-3.5 text-slate-400 text-sm pointer-events-none z-10"></i>
                        <input type="password" name="confirm_password" required class="input-field w-full pl-10 text-sm" placeholder="Re-enter password">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-success w-full justify-center py-3 text-sm font-semibold shadow-lg shadow-emerald-500/25">
                    <i class="fas fa-rocket"></i> Register Free Account
                </button>
            </form>
            
            <div class="text-center pt-2 border-t border-slate-200 dark:border-slate-800/80">
                <p class="text-xs text-slate-600 dark:text-slate-400">
                    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-emerald-600 dark:text-emerald-400 font-semibold hover:underline">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
